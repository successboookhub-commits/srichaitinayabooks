<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Red Page Gradient -->
    <linearGradient id="redPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Dark Page Gradient -->
    <linearGradient id="darkPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Clean Rounded Square Base for High Visibility on Dark & Light Tabs -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2.5" />

  <g filter="url(#shadow)">
    <!-- Arched Overhead Red Crescent Arc -->
    <path d="M 22 42 C 40 22, 80 22, 98 42" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" />

    <!-- Brand Sparkling 4-Point Star -->
    <path d="M 60 16 L 62.5 22.5 L 69 25 L 62.5 27.5 L 60 34 L 57.5 27.5 L 51 25 L 57.5 22.5 Z" fill="#dc2626" />

    <!-- Open Book Left Page (Black/Slate) -->
    <path d="M 60 88 C 42 81, 26 86, 18 90 L 18 48 C 26 44, 42 39, 60 46 Z" fill="url(#darkPage)" />
    <!-- Left Page Subtle Lines -->
    <path d="M 25 54 C 35 51, 46 49, 54 53" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <path d="M 25 64 C 35 61, 46 59, 54 63" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
    <path d="M 25 74 C 35 71, 46 69, 54 73" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

    <!-- Open Book Right Page (Sri Chaitanya Brand Red) -->
    <path d="M 60 88 C 78 81, 94 86, 102 90 L 102 48 C 94 44, 78 39, 60 46 Z" fill="url(#redPage)" />
    <!-- Right Page Subtle Lines -->
    <path d="M 66 53 C 74 49, 85 51, 95 54" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />
    <path d="M 66 63 C 74 59, 85 61, 95 64" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />
    <path d="M 66 73 C 74 69, 85 71, 95 74" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

    <!-- Book Center Spine -->
    <path d="M 60 46 L 60 88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>

